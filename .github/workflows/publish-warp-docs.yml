name: Publish Starter Docs
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - zensical.toml
      - docs/**
      - iosApp/CounterWidget/**
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Generate Wizard HTML
        run: python docs/wizard.py
      - name: Build Docs Site with Zensical
        run: |
          pip install zensical
          zensical build --clean
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
